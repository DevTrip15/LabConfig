[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-marlinfw.org_Marlin_USB_Device_0101100895D784E26246BF4AF50020C4-if00

[virtual_sdcard]
path: /home/lab/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[extruder]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio9
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 25.12
pid_Ki: 1.073
pid_Kd: 147
min_temp: 0
max_temp: 300
full_steps_per_rotation: 200
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
max_extrude_cross_section:2
pressure_advance: 0.35

[tmc2209 extruder]
uart_pin: gpio15
tx_pin: gpio8
uart_address: 0
run_current: 0.6
hold_current: 0.3

[include autotune_tmc.cfg]

[include KAMP_Settings.cfg]

[exclude_object]
